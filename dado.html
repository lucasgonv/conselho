<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dado</title>
<style>
  :root{
    --bg:#111319; --panel:#1a1d26; --panel-2:#20232e; --border:#2b2f3d;
    --text:#eeeee6; --muted:#8b8f9e; --accent:#ffc93c; --accent-text:#1a1508;
  }
  html[data-theme="light"]{
    --bg:#f5f4f0; --panel:#ffffff; --panel-2:#eeece5; --border:#dcd9d0;
    --text:#1c1c1c; --muted:#6b6b6b; --accent:#c98a1a; --accent-text:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  body{padding:70px 20px 80px;display:flex;justify-content:center;}
  a.back-link{position:fixed;top:16px;left:16px;color:var(--muted);text-decoration:none;
    font-size:14px;border:1px solid var(--border);background:var(--panel-2);
    border-radius:6px;padding:8px 12px;}
  a.back-link:hover{border-color:var(--accent);color:var(--text);}
  button.theme-toggle{position:fixed;top:16px;right:16px;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);border-radius:6px;
    padding:10px 16px;font-size:14px;font-weight:600;}
  button:hover{border-color:var(--accent);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;}
  .config{display:flex;gap:12px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;font-family:inherit;font-size:14px;width:100%;}
  .field input:focus{outline:none;border-color:var(--accent);}
  .dice-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;
    align-items:center;}
  .die{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    width:56px;height:56px;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;color:var(--muted);transition:border-color 0.15s,color 0.15s;}
  .die.filled{color:var(--accent);border-color:var(--accent);}
  .total{text-align:center;font-size:13px;color:var(--muted);min-height:16px;}
  .roll-btn{background:var(--accent);color:var(--accent-text);border-color:var(--accent);
    padding:12px;font-size:15px;}
  .roll-btn:hover{opacity:0.9;}
  .roll-btn:disabled{opacity:0.6;cursor:default;}
</style>
</head>
<body>

<a class="back-link" href="index.html">← Início</a>
<button class="theme-toggle" id="theme-toggle" type="button">Modo claro</button>

<div class="card">
  <div class="config">
    <div class="field">
      <label for="qtd">Quantidade de dados</label>
      <input type="number" id="qtd" value="1" min="1" max="12">
    </div>
    <div class="field">
      <label for="faces">Faces por dado</label>
      <input type="number" id="faces" value="6" min="2" max="100">
    </div>
  </div>
  <div class="dice-row" id="dice-row">
    <div class="die">?</div>
  </div>
  <div class="total" id="total"></div>
  <button class="roll-btn" id="roll-btn" type="button">Rolar</button>
</div>

<script>
(function(){
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme-toggle');
  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'light' ? 'Modo escuro' : 'Modo claro';
    localStorage.setItem('theme', theme);
  }
  applyTheme(localStorage.getItem('theme')
    || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  themeBtn.addEventListener('click', function(){
    applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });
})();

(function(){
  const qtdInput = document.getElementById('qtd');
  const facesInput = document.getElementById('faces');
  const diceRow = document.getElementById('dice-row');
  const total = document.getElementById('total');
  const rollBtn = document.getElementById('roll-btn');

  rollBtn.addEventListener('click', function(){
    const qtd = Math.min(Math.max(parseInt(qtdInput.value) || 1, 1), 12);
    const faces = Math.max(parseInt(facesInput.value) || 6, 2);

    diceRow.innerHTML = '';
    const dieEls = [];
    for (let i = 0; i < qtd; i++){
      const el = document.createElement('div');
      el.className = 'die';
      el.textContent = '?';
      diceRow.appendChild(el);
      dieEls.push(el);
    }
    total.textContent = '';
    rollBtn.disabled = true;

    let ticks = 0;
    const maxTicks = 12 + Math.floor(Math.random() * 6);

    const interval = setInterval(function(){
      let sum = 0;
      dieEls.forEach(function(el){
        const v = 1 + Math.floor(Math.random() * faces);
        el.textContent = v;
        el.classList.add('filled');
        sum += v;
      });
      ticks++;
      if (ticks >= maxTicks){
        clearInterval(interval);
        rollBtn.disabled = false;
        if (qtd > 1) total.textContent = 'total: ' + sum;
      }
    }, 70);
  });
})();
</script>

</body>
</html>
