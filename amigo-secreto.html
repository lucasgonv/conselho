<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigo Secreto</title>
<style>
  :root{
    --bg:#111319; --panel:#1a1d26; --panel-2:#20232e; --border:#2b2f3d;
    --text:#eeeee6; --muted:#8b8f9e; --accent:#ffc93c; --accent-text:#1a1508;
  }
  html[data-theme="light"]{
    --bg:#f5f4f0; --panel:#ffffff; --panel-2:#eeece5; --border:#dcd9d0;
    --text:#1c1c1c; --muted:#6b6b6b; --accent:#c98a1a; --accent-text:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  body{padding:70px 20px 80px;}
  a.back-link{position:fixed;top:16px;left:16px;color:var(--muted);text-decoration:none;
    font-size:14px;border:1px solid var(--border);background:var(--panel-2);
    border-radius:6px;padding:8px 12px;}
  a.back-link:hover{border-color:var(--accent);color:var(--text);}
  button.theme-toggle{position:fixed;top:16px;right:16px;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);border-radius:6px;
    padding:10px 16px;font-size:14px;font-weight:600;}
  button:hover{border-color:var(--accent);}
  .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;}
  textarea{width:100%;min-height:140px;resize:vertical;background:var(--panel-2);
    border:1px solid var(--border);color:var(--text);border-radius:6px;padding:10px;
    font-family:inherit;font-size:13px;line-height:1.5;}
  textarea:focus{outline:none;border-color:var(--accent);}
  textarea::placeholder{color:var(--muted);}
  .sortear-btn{width:100%;background:var(--accent);color:var(--accent-text);
    border-color:var(--accent);padding:12px;font-size:15px;margin-top:12px;}
  .sortear-btn:hover{opacity:0.9;}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;}
  .pairs{display:flex;flex-direction:column;gap:8px;}
  .pair{background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .pair .name{font-weight:600;}
  .pair .reveal-btn{font-size:13px;padding:8px 12px;}
  .pair .match{color:var(--accent);font-weight:700;}
  .empty{color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<a class="back-link" href="index.html">← Início</a>
<button class="theme-toggle" id="theme-toggle" type="button">Modo claro</button>

<div class="wrap">
  <div class="card">
    <textarea id="names" placeholder="lucas&#10;yuri&#10;renzo&#10;daniel"></textarea>
    <button class="sortear-btn" id="sortear-btn" type="button">Sortear amigo secreto</button>
    <p class="hint">ninguém tira a si mesmo. depois de sortear, passe o dispositivo e cada um clica só no próprio nome para revelar.</p>
  </div>
  <div class="pairs" id="pairs"></div>
</div>

<script>
(function(){
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme-toggle');
  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'light' ? 'Modo escuro' : 'Modo claro';
    localStorage.setItem('theme', theme);
  }
  applyTheme(localStorage.getItem('theme')
    || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  themeBtn.addEventListener('click', function(){
    applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });
})();

(function(){
  const namesInput = document.getElementById('names');
  const sortearBtn = document.getElementById('sortear-btn');
  const pairsEl = document.getElementById('pairs');

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function sortearDerangement(names){
    // tenta embaralhar até ninguém ficar com o próprio nome
    for (let tentativa = 0; tentativa < 200; tentativa++){
      const shuffled = shuffle(names.slice());
      let valido = true;
      for (let i = 0; i < names.length; i++){
        if (shuffled[i] === names[i]){ valido = false; break; }
      }
      if (valido) return shuffled;
    }
    return null;
  }

  sortearBtn.addEventListener('click', function(){
    const names = namesInput.value.split('\n')
      .map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length > 0; });

    pairsEl.innerHTML = '';

    if (names.length < 3){
      pairsEl.innerHTML = '<p class="empty">adicione pelo menos 3 nomes</p>';
      return;
    }

    const matches = sortearDerangement(names);
    if (!matches){
      pairsEl.innerHTML = '<p class="empty">não foi possível sortear, tente de novo</p>';
      return;
    }

    names.forEach(function(name, i){
      const div = document.createElement('div');
      div.className = 'pair';

      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = name;

      const revealBtn = document.createElement('button');
      revealBtn.className = 'reveal-btn';
      revealBtn.type = 'button';
      revealBtn.textContent = 'Revelar';

      revealBtn.addEventListener('click', function(){
        const span = document.createElement('span');
        span.className = 'match';
        span.textContent = 'tirou ' + matches[i];
        revealBtn.replaceWith(span);
      });

      div.appendChild(nameSpan);
      div.appendChild(revealBtn);
      pairsEl.appendChild(div);
    });
  });
})();
</script>

</body>
</html>
