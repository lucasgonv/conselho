<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta Instantânea</title>
<style>
  :root{
    --bg:#111319;
    --panel:#1a1d26;
    --panel-2:#20232e;
    --border:#2b2f3d;
    --text:#eeeee6;
    --muted:#8b8f9e;
    --accent:#ffc93c;
    --accent-text:#1a1508;
  }

  html[data-theme="light"]{
    --bg:#f5f4f0;
    --panel:#ffffff;
    --panel-2:#eeece5;
    --border:#dcd9d0;
    --text:#1c1c1c;
    --muted:#6b6b6b;
    --accent:#c98a1a;
    --accent-text:#ffffff;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex;
    flex-direction:column;
  }

  .theme-toggle{
    position:fixed;
    top:16px;
    right:16px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    border-radius:6px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }

  .theme-toggle:hover{
    border-color:var(--accent);
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  h1{
    font-size:clamp(28px,5vw,44px);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 12px;
  }

  p{
    color:var(--muted);
    font-size:16px;
    margin:0 0 32px;
    max-width:420px;
  }

  .open-btn{
    display:inline-block;
    background:var(--accent);
    color:var(--accent-text);
    text-decoration:none;
    font-weight:700;
    font-size:16px;
    padding:14px 28px;
    border-radius:8px;
    border:1px solid var(--accent);
  }

  .open-btn:hover{
    opacity:0.9;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" type="button">Modo claro</button>

<main>
  <h1>Roleta Instantânea</h1>
  <p>Cole uma lista de nomes, sorteie na hora. Várias roletas ao mesmo tempo, sem enrolação.</p>
  <a class="open-btn" href="roleta.html">Abrir roleta</a>
</main>

<script>
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');

  function apply(theme){
    root.setAttribute('data-theme', theme);
    btn.textContent = theme === 'light' ? 'Modo escuro' : 'Modo claro';
    localStorage.setItem('theme', theme);
  }

  const saved = localStorage.getItem('theme')
    || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  apply(saved);

  btn.addEventListener('click', function(){
    const current = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    apply(current);
  });
})();
</script>

</body>
</html>
